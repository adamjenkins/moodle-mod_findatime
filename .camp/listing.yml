name: mod_findatime
summary: 'A Moodle activity where participants mark their availability on a time grid, see a colour-coded overlap map, and confirm a meeting time.'
description: |
  Everyone taking part marks when they are available, if need be, or
  unavailable on a time grid shown in their own timezone. A colour-coded map
  shows where their availability overlaps and the best meeting times. A
  teacher, or any participant if allowed, confirms a time; this creates a
  calendar event and notifies everyone. Especially useful for group work
  (with separate groups, each group finds its own time), and equally for a
  whole course or for teachers planning together. Necessary participants, a
  respond-by date with reminders, and automatic confirmation of the most
  popular time help people decide.
